<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Signal · 极简投资情报原型</title>
  <!--
    设计假设：
    1. 面向关注 Twitter/X 投资博主的个人投资者，桌面端优先并兼容移动端。
    2. 首屏只服务“发现重要观点—理解依据—决定是否继续跟踪”。
    3. 当前代码的深蓝、青绿视觉被保留为品牌记忆，但降低卡片、阴影和指标密度。
    4. 本文件仅为交互原型，不调用真实接口，所有内容均为示例数据。
  -->
  <style>
    :root {
      --canvas: #f4f6f3;
      --paper: #ffffff;
      --paper-soft: #f8faf7;
      --ink: #10211d;
      --ink-2: #31443e;
      --muted: #667772;
      --faint: #8b9995;
      --line: #dfe6e1;
      --line-strong: #cbd6d0;
      --brand: #0b7567;
      --brand-dark: #07594f;
      --brand-soft: #e9f4f0;
      --amber: #9c661c;
      --amber-soft: #fbf2e2;
      --red: #9f4348;
      --red-soft: #f9ebec;
      --blue: #3e617d;
      --blue-soft: #edf3f7;
      --radius: 14px;
      --shadow: 0 18px 50px rgba(24, 45, 38, .10);
      --font: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
      --mono: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html { background: var(--canvas); }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: var(--canvas);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.6;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: auto;
      font-variant-numeric: tabular-nums;
    }
    button, input, textarea { font: inherit; }
    button { border: 0; cursor: pointer; }
    a { color: inherit; }
    svg { display: block; }
    :focus-visible { outline: 3px solid rgba(11, 117, 103, .20); outline-offset: 2px; }

    .prototype-label {
      position: fixed;
      right: 16px;
      bottom: 14px;
      z-index: 90;
      padding: 6px 9px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255,255,255,.92);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      box-shadow: 0 4px 18px rgba(22,42,35,.08);
      backdrop-filter: blur(10px);
    }

    .shell { min-height: 100vh; }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 30;
      width: 208px;
      display: flex;
      flex-direction: column;
      padding: 24px 16px 18px;
      border-right: 1px solid var(--line);
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(16px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 42px;
      padding: 0 8px;
    }
    .brand-mark {
      position: relative;
      width: 25px;
      height: 25px;
      border: 1.5px solid var(--brand);
      border-radius: 50%;
    }
    .brand-mark::before {
      content: "";
      position: absolute;
      width: 7px;
      height: 7px;
      top: 4px;
      right: 3px;
      border-radius: 50%;
      background: var(--brand);
      box-shadow: -8px 8px 0 -2px #d79531;
    }
    .brand strong {
      font-size: 15px;
      font-weight: 720;
      letter-spacing: -.01em;
    }
    .brand span {
      display: block;
      margin-top: -2px;
      color: var(--faint);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .nav {
      display: grid;
      gap: 5px;
      margin-top: 34px;
    }
    .nav-button {
      width: 100%;
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 12px;
      border-radius: 9px;
      color: var(--muted);
      background: transparent;
      font-size: 14px;
      font-weight: 620;
      text-align: left;
      transition: color .15s ease, background .15s ease;
    }
    .nav-button:hover { color: var(--ink); background: var(--paper-soft); }
    .nav-button.active { color: var(--brand-dark); background: var(--brand-soft); }
    .nav-button .nav-count {
      margin-left: auto;
      min-width: 22px;
      height: 20px;
      display: grid;
      place-items: center;
      padding: 0 6px;
      border-radius: 999px;
      color: var(--brand-dark);
      background: rgba(255,255,255,.82);
      font-family: var(--mono);
      font-size: 11px;
    }

    .sidebar-note {
      margin-top: auto;
      padding: 13px 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .sidebar-note strong {
      display: block;
      margin-bottom: 4px;
      color: var(--ink-2);
      font-size: 12px;
    }
    .profile {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 14px;
      padding: 8px;
      border-radius: 10px;
    }
    .avatar {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 50%;
      color: white;
      background: var(--ink);
      font-size: 11px;
      font-weight: 700;
    }
    .profile strong, .profile span { display: block; }
    .profile strong { font-size: 12px; font-weight: 680; }
    .profile span { color: var(--faint); font-size: 10px; }

    .workspace {
      min-width: 0;
      margin-left: 208px;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 68px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 clamp(24px, 4vw, 58px);
      border-bottom: 1px solid rgba(203,214,208,.72);
      background: rgba(244,246,243,.90);
      backdrop-filter: blur(18px);
    }
    .mobile-brand { display: none; }
    .search-trigger {
      min-width: 260px;
      height: 38px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--muted);
      background: rgba(255,255,255,.72);
      font-size: 13px;
      text-align: left;
    }
    .search-trigger kbd {
      margin-left: auto;
      padding: 1px 6px;
      border: 1px solid var(--line);
      border-radius: 5px;
      color: var(--faint);
      background: white;
      font-family: var(--mono);
      font-size: 10px;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }
    .icon-button {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--muted);
      background: rgba(255,255,255,.72);
    }
    .primary-button, .quiet-button {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 13px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 680;
    }
    .primary-button { color: white; background: var(--ink); }
    .primary-button:hover { background: #20352f; }
    .quiet-button { border: 1px solid var(--line); color: var(--ink-2); background: white; }
    .quiet-button:hover { border-color: var(--line-strong); background: var(--paper-soft); }

    .page {
      width: min(100%, 1320px);
      margin: 0 auto;
      padding: 42px clamp(24px, 4vw, 58px) 90px;
    }
    .page.with-detail {
      display: grid;
      grid-template-columns: minmax(0, 760px) minmax(300px, 360px);
      align-items: start;
      justify-content: center;
      gap: clamp(34px, 5vw, 70px);
    }
    .page-main { min-width: 0; }
    .page-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }
    .eyebrow {
      margin: 0 0 6px;
      color: var(--brand);
      font-size: 12px;
      font-weight: 730;
      letter-spacing: .08em;
    }
    h1, h2, h3, p { margin-top: 0; }
    h1 {
      margin-bottom: 6px;
      color: var(--ink);
      font-size: clamp(30px, 3vw, 40px);
      font-weight: 720;
      line-height: 1.18;
      letter-spacing: -.035em;
    }
    .page-heading p {
      margin-bottom: 0;
      color: var(--muted);
      font-size: 14px;
    }
    .freshness {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--faint);
      font-size: 12px;
      white-space: nowrap;
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #2f987b;
      box-shadow: 0 0 0 4px rgba(47,152,123,.10);
    }

    .priority-brief {
      position: relative;
      overflow: hidden;
      margin-bottom: 25px;
      padding: 20px 20px 19px 23px;
      border: 1px solid #c8ddd5;
      border-radius: var(--radius);
      background: #f6fbf8;
    }
    .priority-brief::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: var(--brand);
    }
    .priority-brief > span {
      color: var(--brand);
      font-size: 11px;
      font-weight: 760;
      letter-spacing: .08em;
    }
    .priority-brief h2 {
      max-width: 650px;
      margin: 7px 0 5px;
      color: var(--ink);
      font-size: 18px;
      font-weight: 700;
      line-height: 1.45;
      letter-spacing: -.012em;
    }
    .priority-brief p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .feed-toolbar {
      display: flex;
      align-items: center;
      gap: 18px;
      min-height: 44px;
      border-bottom: 1px solid var(--line);
    }
    .feed-filter {
      position: relative;
      height: 44px;
      padding: 0 1px;
      color: var(--muted);
      background: transparent;
      font-size: 13px;
      font-weight: 650;
    }
    .feed-filter.active { color: var(--ink); }
    .feed-filter.active::after {
      content: "";
      position: absolute;
      inset: auto 0 -1px;
      height: 2px;
      background: var(--brand);
    }
    .feed-count {
      margin-left: auto;
      color: var(--faint);
      font-size: 12px;
    }

    .feed-list { border-bottom: 1px solid var(--line); }
    .signal-item {
      position: relative;
      width: 100%;
      display: grid;
      grid-template-columns: 70px minmax(0, 1fr) 24px;
      gap: 17px;
      padding: 23px 14px 23px 4px;
      border-bottom: 1px solid var(--line);
      color: inherit;
      background: transparent;
      text-align: left;
      transition: background .15s ease;
    }
    .signal-item:last-child { border-bottom: 0; }
    .signal-item:hover { background: rgba(255,255,255,.55); }
    .signal-item.selected {
      margin-inline: -12px;
      width: calc(100% + 24px);
      padding-inline: 16px 14px;
      border-radius: 11px;
      background: white;
      box-shadow: 0 7px 25px rgba(31,54,46,.06);
    }
    .signal-asset {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      padding-top: 2px;
    }
    .signal-asset strong {
      font-family: var(--mono);
      font-size: 14px;
      letter-spacing: -.02em;
    }
    .direction {
      padding: 3px 6px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 720;
      white-space: nowrap;
    }
    .direction.bullish { color: #176b55; background: #e9f5f0; }
    .direction.bearish { color: var(--red); background: var(--red-soft); }
    .direction.neutral { color: var(--blue); background: var(--blue-soft); }
    .signal-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 7px;
      color: var(--faint);
      font-size: 11px;
    }
    .source-name { color: var(--ink-2); font-weight: 660; }
    .verified {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--brand);
      font-weight: 660;
    }
    .signal-copy h3 {
      margin: 0 0 8px;
      color: var(--ink);
      font-size: 16px;
      font-weight: 690;
      line-height: 1.48;
      letter-spacing: -.008em;
    }
    .signal-copy > p {
      display: -webkit-box;
      overflow: hidden;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .signal-foot {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
      color: var(--faint);
      font-size: 11px;
    }
    .signal-foot span { display: inline-flex; align-items: center; gap: 4px; }
    .signal-arrow {
      align-self: center;
      color: var(--line-strong);
      transition: transform .15s, color .15s;
    }
    .signal-item:hover .signal-arrow,
    .signal-item.selected .signal-arrow { color: var(--brand); transform: translateX(2px); }

    .detail-panel {
      position: sticky;
      top: 104px;
      max-height: calc(100vh - 128px);
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }
    .detail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 19px;
      border-bottom: 1px solid var(--line);
    }
    .detail-head div {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--ink-2);
      font-size: 12px;
      font-weight: 720;
    }
    .detail-close {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: var(--faint);
      background: transparent;
    }
    .detail-close:hover { color: var(--ink); background: var(--paper-soft); }
    .detail-body { padding: 21px 20px 20px; }
    .detail-kicker {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      color: var(--muted);
      font-size: 11px;
    }
    .detail-body h2 {
      margin: 10px 0 13px;
      font-size: 20px;
      font-weight: 710;
      line-height: 1.42;
      letter-spacing: -.02em;
    }
    .detail-thesis {
      margin: 0;
      color: var(--ink-2);
      font-size: 14px;
      line-height: 1.75;
    }
    .detail-section {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }
    .detail-section > span {
      display: block;
      margin-bottom: 10px;
      color: var(--faint);
      font-size: 11px;
      font-weight: 720;
      letter-spacing: .06em;
    }
    .evidence-quote {
      margin: 0;
      padding-left: 13px;
      border-left: 2px solid var(--line-strong);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.72;
    }
    .identity-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 13px;
      align-items: center;
      padding: 12px;
      border-radius: 10px;
      background: var(--paper-soft);
    }
    .identity-row strong, .identity-row span { display: block; }
    .identity-row strong {
      font-family: var(--mono);
      font-size: 13px;
    }
    .identity-row span { margin-top: 2px; color: var(--muted); font-size: 11px; }
    .identity-check {
      color: var(--brand);
      font-size: 11px;
      font-weight: 720;
    }
    .detail-list {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .detail-list li {
      position: relative;
      padding-left: 14px;
      color: var(--ink-2);
      font-size: 13px;
    }
    .detail-list li::before {
      content: "";
      position: absolute;
      top: .67em;
      left: 0;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--brand);
    }
    .detail-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 22px;
    }
    .detail-actions .quiet-button, .detail-actions .primary-button { width: 100%; }

    .simple-page {
      width: min(100%, 920px);
      margin: 0 auto;
    }
    .simple-intro {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 34px;
    }
    .simple-intro p { max-width: 560px; margin: 7px 0 0; color: var(--muted); font-size: 14px; }
    .list-surface {
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .source-row, .watch-row {
      display: grid;
      align-items: center;
      gap: 16px;
      padding: 18px 4px;
      border-bottom: 1px solid var(--line);
      background: transparent;
    }
    .source-row:last-child, .watch-row:last-child { border-bottom: 0; }
    .source-row { grid-template-columns: 46px minmax(0, 1fr) auto; }
    .source-avatar {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--brand-dark);
      background: var(--brand-soft);
      font-size: 12px;
      font-weight: 730;
    }
    .source-row h3, .source-row p { margin: 0; }
    .source-row h3 { font-size: 14px; font-weight: 690; }
    .source-row h3 span { margin-left: 7px; color: var(--faint); font-size: 11px; font-weight: 500; }
    .source-row p { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .source-status {
      display: flex;
      align-items: center;
      gap: 15px;
      color: var(--faint);
      font-size: 11px;
      text-align: right;
    }
    .source-status strong { display: block; color: var(--ink-2); font-size: 12px; }
    .watch-row { grid-template-columns: 92px minmax(0, 1fr) auto; }
    .watch-symbol strong {
      display: block;
      font-family: var(--mono);
      font-size: 16px;
    }
    .watch-symbol span { color: var(--faint); font-size: 11px; }
    .watch-summary strong, .watch-summary span { display: block; }
    .watch-summary strong { font-size: 14px; font-weight: 670; }
    .watch-summary span { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .watch-activity { text-align: right; }
    .watch-activity strong { display: block; color: var(--brand); font-size: 13px; }
    .watch-activity span { color: var(--faint); font-size: 11px; }

    .assistant-page {
      width: min(100%, 840px);
      min-height: calc(100vh - 200px);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }
    .assistant-empty {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 60px 0 36px;
      text-align: center;
    }
    .assistant-empty > div { max-width: 590px; }
    .assistant-orb {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      margin: 0 auto 17px;
      border: 1px solid #c5dcd4;
      border-radius: 50%;
      color: var(--brand);
      background: var(--brand-soft);
    }
    .assistant-empty h1 { font-size: 30px; }
    .assistant-empty > div > p { color: var(--muted); font-size: 14px; }
    .prompts {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
    }
    .prompt-chip {
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: white;
      font-size: 12px;
    }
    .prompt-chip:hover { color: var(--brand-dark); border-color: #b9d6cc; }
    .assistant-answer {
      margin-top: 22px;
      padding: 20px 21px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: white;
      text-align: left;
    }
    .assistant-answer span { color: var(--brand); font-size: 11px; font-weight: 720; }
    .assistant-answer p { margin: 8px 0 0; color: var(--ink-2); font-size: 14px; line-height: 1.75; }
    .assistant-answer small { display: block; margin-top: 12px; color: var(--faint); }
    .composer {
      position: sticky;
      bottom: 24px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      padding: 8px;
      border: 1px solid var(--line-strong);
      border-radius: 14px;
      background: rgba(255,255,255,.95);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }
    .composer input {
      min-width: 0;
      height: 42px;
      padding: 0 10px;
      border: 0;
      outline: 0;
      color: var(--ink);
      background: transparent;
      font-size: 14px;
    }
    .composer button {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: white;
      background: var(--ink);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(15, 30, 25, .34);
      backdrop-filter: blur(4px);

      return <main className="page" data-screen-label="研究助手">
        <section className="assistant-page">
          <div className="assistant-empty"><div><span className="assistant-orb"><Icon name="assistant" size={21} /></span><h1>问你的情报库</h1><p>答案只基于已采集的推文、图片分析和核验证据；没有证据时，助手会明确告诉你。</p><div className="prompts">{suggestions.map(function(item){ return <button className="prompt-chip" key={item} onClick={function(){ submit(item); }}>{item}</button>; })}</div>{answer && <div className="assistant-answer"><span>基于 3 条证据</span><p>{answer}</p><small>来源：@qinbafrank 等 2 位博主 · 最近更新于 18 分钟前</small></div>}</div></div>
          <form className="composer" onSubmit={function(event){ event.preventDefault(); submit(); }}><input value={question} onChange={function(event){ setQuestion(event.target.value); }} placeholder="询问博主观点、标的变化或原文证据…" /><button aria-label="发送"><Icon name="send" size={17} /></button></form>
        </section>
      </main>;
    }

    function AddSourceModal({ onClose, onComplete }) {
      const [handle, setHandle] = useState("");
      function submit(event) {
        event.preventDefault();
        if (!handle.trim()) return;
        onComplete(handle.replace("@", ""));
      }
      return <div className="modal-backdrop" onMouseDown={function(event){ if (event.target === event.currentTarget) onClose(); }}>
        <form className="modal" onSubmit={submit}>
          <div className="modal-head"><div><h2>新增信息源</h2><p>输入 Twitter Handle，其余步骤自动完成。</p></div><button type="button" className="detail-close" onClick={onClose}><Icon name="close" size={18} /></button></div>
          <label className="field-label" htmlFor="source-handle">Twitter Handle</label>
          <div className="handle-field"><span>@</span><input id="source-handle" autoFocus value={handle} onChange={function(event){ setHandle(event.target.value); }} placeholder="username" /></div>
          <p className="field-help">系统会获取资料、开始采集，并自动分析文本和图片。</p>
          <div className="modal-actions"><button type="button" className="quiet-button" onClick={onClose}>取消</button><button className="primary-button" disabled={!handle.trim()}>添加并关注</button></div>
        </form>
      </div>;
    }

    function App() {
      const [view, setView] = useState("today");
      const [showAdd, setShowAdd] = useState(false);
      const [toast, setToast] = useState("");
      useEffect(function(){
        if (!toast) return undefined;
        const timer = window.setTimeout(function(){ setToast(""); }, 2400);
        return function(){ window.clearTimeout(timer); };
      }, [toast]);
      function completeAdd(handle) {
        setShowAdd(false);
        setToast("已添加 @" + handle + "，正在获取资料");
        setView("sources");
      }
      return <div className="shell">
        <Sidebar view={view} setView={setView} />
        <section className="workspace">
          <Topbar onAdd={function(){ setShowAdd(true); }} />
          {view === "today" && <TodayPage />}
          {view === "sources" && <SourcesPage onAdd={function(){ setShowAdd(true); }} />}
          {view === "watch" && <WatchPage />}
          {view === "assistant" && <AssistantPage />}
        </section>
        {showAdd && <AddSourceModal onClose={function(){ setShowAdd(false); }} onComplete={completeAdd} />}
        {toast && <div className="toast">{toast}</div>}
      </div>;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
